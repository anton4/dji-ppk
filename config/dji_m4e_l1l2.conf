# RTKLIB-EX configuration for DJI Matrice 4E PPK against an ESTPOS (Leica Spider) base.
# Based on the Emlid Studio 1.10 settings that fixed 1229/1230 photo events on the reference flight:
# kinematic, combined filter, 15 deg mask, SNR 35, GPS+SBAS+Galileo+QZSS only, fix-and-hold.
# Verified on that flight with RTKLIB-EX 2.5.1: 1230/1230 events fixed, 100 % of the trajectory fixed,
# median 3D difference to Emlid 5.8 mm (1.5 mm horizontal, 5.7 mm vertical). Adding
# `--set pos1-posopt2=off` (antenna offset only, no elevation-dependent PCV) reproduces Emlid to 2 mm.
#
# Do NOT change:
#   pos1-navsys=63 (GLONASS+BeiDou on) -> no solution at all with this receiver pair (Emlid: 3.5 % fixed)
#   misc-timeinterp=on                 -> RTKLIB stops writing the *_events.pos camera solutions

pos1-posmode       =kinematic   # (0:single,1:dgps,2:kinematic,3:static,...)
pos1-frequency     =l1+l2       # two-frequency variant (Emlid parity test: 1230/1230 fixed, 14 mm 3D median vs Emlid)
pos1-soltype       =combined    # (0:forward,1:backward,2:combined,3:combined-nophasereset)
pos1-elmask        =15          # (deg)
pos1-snrmask_r     =on
pos1-snrmask_b     =on
pos1-snrmask_L1    =35,35,35,35,35,35,35,35,35
pos1-snrmask_L2    =35,35,35,35,35,35,35,35,35
pos1-snrmask_L5    =35,35,35,35,35,35,35,35,35
pos1-dynamics      =on
pos1-tidecorr      =off
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-posopt1       =off         # rover antenna PCV (no model for the DJI antenna)
pos1-posopt2       =on          # base antenna PCV from ANTEX (LEIAR25.R4 LEIT in the virtual RINEX header)
pos1-posopt3       =off         # phase windup (RTK: off)
pos1-posopt4       =off
pos1-posopt5       =off
pos1-exclsats      =
pos1-navsys        =27          # 1:gps+2:sbas+4:glo+8:gal+16:qzs+32:bds+64:navic

pos2-armode        =fix-and-hold  # (0:off,1:continuous,2:instantaneous,3:fix-and-hold)
pos2-gloarmode     =off
pos2-bdsarmode     =off
pos2-arfilter      =on
pos2-arthres       =3
pos2-arthresmin    =3
pos2-arthresmax    =3
pos2-arthres1      =0.1
pos2-arthres2      =0
pos2-arthres3      =1e-09
pos2-arthres4      =1e-05
pos2-varholdamb    =0.1
pos2-gainholdamb   =0.01
pos2-arlockcnt     =0
pos2-minfixsats    =4
pos2-minholdsats   =5
pos2-mindropsats   =10
pos2-arelmask      =15
pos2-arminfix      =20
pos2-armaxiter     =1
pos2-elmaskhold    =15
pos2-aroutcnt      =20
pos2-maxage        =30
pos2-syncsol       =off
pos2-slipthres     =0.05
pos2-dopthres      =0
pos2-rejphase      =1
pos2-rejcode       =30
pos2-niter         =1
pos2-baselen       =0
pos2-basesig       =0

out-solformat      =llh
out-outhead        =on
out-outopt         =on
out-outvel         =off
out-timesys        =gpst
out-timeform       =hms
out-timendec       =6
out-degform        =deg
out-fieldsep       =
out-outsingle      =off
out-maxsolstd      =0
out-height         =ellipsoidal
out-geoid          =internal
out-solstatic      =all
out-outstat        =off

stats-eratio1      =300
stats-eratio2      =300
stats-eratio5      =300
stats-errphase     =0.003
stats-errphaseel   =0.003
stats-errphasebl   =0
stats-errdoppler   =1
stats-snrmax       =52
stats-errsnr       =0
stats-errrcv       =0
stats-stdbias      =30
stats-stdiono      =0.03
stats-stdtrop      =0.3
stats-prnaccelh    =3
stats-prnaccelv    =1
stats-prnbias      =0.0001
stats-prniono      =0.001
stats-prntrop      =0.0001
stats-prnpos       =0
stats-clkstab      =5e-12

ant1-postype       =single
ant1-anttype       =
ant1-antdele       =0
ant1-antdeln       =0
ant1-antdelu       =0
ant2-postype       =rinexhead   # base position from the RINEX APPROX POSITION XYZ header (matches Emlid)
ant2-anttype       =*           # take antenna type from the RINEX header
ant2-antdele       =0
ant2-antdeln       =0
ant2-antdelu       =0
ant2-maxaveep      =1
ant2-initrst       =on

misc-timeinterp    =off         # MUST stay off: "on" suppresses the *_events.pos output (verified with 2.5.1)
misc-sbasatsel     =0
misc-rnxopt1       =            # rover signal selection / phase shift, e.g. -EL5I -EL7I
misc-rnxopt2       =            # base  signal selection / phase shift, e.g. -EL1C=0.5 -EL5Q=-0.25
misc-pppopt        =
file-rcvantfile    =/app/antex/igs20.atx
