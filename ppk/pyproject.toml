[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppk"
version = "0.1.0"
description = "DJI drone PPK processing with RTKLIB-EX against ESTPOS base RINEX"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ppk = "ppk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ppk*"]
